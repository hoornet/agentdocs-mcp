name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the engines.node floor (EOL, kept while engines allows it); 22,
        # 24 and 26 are the lines users run. Node 24 changed node:http's
        # chunking under a test that only ever ran on 20 (see CHANGELOG 0.10.5).
        node: ["20", "22", "24", "26"]
    name: build-and-test (Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # nothing here pushes; don't leave GITHUB_TOKEN on the runner

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Builds to dist/ and runs test/*.test.mjs. The smoke scripts are NOT run
      # here — they need real credentials and write to a live instance.
      - run: npm run test:unit
